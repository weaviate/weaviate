maximum_allowed_collections_count: 70
autoschema_enabled: true
async_replication_disabled: false
tenant_activity_read_log_level: info
tenant_activity_write_log_level: info
query_slow_log_enabled: true
query_slow_log_threshold: 100ms
inverted_sorter_disabled: false
# Toggle the GraphQL API on/off at runtime (defaults to the DISABLE_GRAPHQL env var).
# disable_graphql: false
# Answer 410 Gone on the /objects/{id} and /objects/{id}/references/{propertyName}
# endpoints that leave out the class (defaults to the DISABLE_OBJECT_ID_ENDPOINTS_WITHOUT_CLASS env var).
# disable_object_id_endpoints_without_class: false
# Answer 410 Gone on GET /objects without the class parameter
# (defaults to the DISABLE_OBJECTS_LIST_WITHOUT_CLASS env var).
# disable_objects_list_without_class: false
# Refuse a beacon without a class on a reference property with several target classes
# (defaults to the DISABLE_MULTI_TARGET_REFERENCES_WITHOUT_CLASS env var).
# disable_multi_target_references_without_class: false
# for usage module if enabled make sure that usage-gcs or usage-s3 module is enabled
# usage_scrape_interval: 1s

# usage_gcs_bucket: weaviate-usage
# usage_gcs_prefix: billing

# usage_s3_bucket: weaviate-usage
# usage_s3_prefix: billing
