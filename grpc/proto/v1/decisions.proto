syntax = "proto3";

package weaviate.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/weaviate/weaviate/grpc/generated;protocol";
option java_package = "io.weaviate.client.grpc.protocol.v1";
option java_outer_classname = "WeaviateProtoDecisions";

// Annotate asks a decisions module typed questions about every object a
// search returns. The answers come back per object in
// SearchResult.annotations, in the order of the questions.
message Annotate {
  repeated DecisionQuestion questions = 1;
  // provider picks the module for this request instead of the collection's.
  optional DecisionsProvider provider = 2;
}

// DecisionsProvider is a decisions module and its options for one request,
// the shape of GenerativeProvider. The module needs no collection config: an
// option left unset takes the collection's setting, then the module's
// default.
message DecisionsProvider {
  oneof kind {
    DecisionsTypeSafeAI typesafeai = 1;
    DecisionsOpenAI openai = 2;
    DecisionsDummy dummy = 3;
    DecisionsCustom custom = 4;
  }
}

message DecisionsTypeSafeAI {
  optional string model = 1;
  optional string base_url = 2;
  optional int64 max_documents = 3;
  // images opts in to the API's experimental image input for blob
  // properties.
  optional bool images = 4;
}

message DecisionsOpenAI {
  optional string model = 1;
  optional string base_url = 2;
  optional int64 max_documents = 3;
}

message DecisionsDummy {
}

// DecisionsCustom names a decisions module the client has no message for,
// with its settings under the names of its collection settings.
message DecisionsCustom {
  string module = 1;
  optional google.protobuf.Struct settings = 2;
}

message DecisionQuestion {
  // name identifies the answer; unique within one request.
  string name = 1;
  // property is the text or blob property the question is about.
  string property = 2;
  string instructions = 3;
  oneof kind {
    DecisionPredicate predicate = 4;
    DecisionChoice choice = 5;
    DecisionScore score = 6;
  }
}

// DecisionPredicate asks whether the instructions hold for the object. The
// answer is a probability.
message DecisionPredicate {
}

// DecisionChoice picks one of the options. The answer is the option with
// the highest probability, the probability of every option and a
// confidence.
message DecisionChoice {
  repeated DecisionOption options = 1;
}

message DecisionOption {
  string value = 1;
  optional string description = 2;
}

// DecisionScore rates the object on ordered levels, lowest first. The
// answer is the probability-weighted position on the levels, 0 for the
// first, the probability of every level and a confidence.
message DecisionScore {
  repeated DecisionLevel levels = 1;
}

message DecisionLevel {
  string label = 1;
  optional string description = 2;
}

message DecisionResult {
  repeated DecisionAnswer answers = 1;
}

message DecisionAnswer {
  string name = 1;
  oneof kind {
    DecisionPredicateAnswer predicate = 2;
    DecisionChoiceAnswer choice = 3;
    DecisionScoreAnswer score = 4;
    // refusal: the model declined to answer this question for this object.
    DecisionRefusal refusal = 5;
  }
}

message DecisionPredicateAnswer {
  double probability = 1;
}

message DecisionChoiceAnswer {
  string choice = 1;
  repeated DecisionProbability probabilities = 2;
  double confidence = 3;
}

message DecisionScoreAnswer {
  double score = 1;
  repeated DecisionProbability probabilities = 2;
  double confidence = 3;
}

// DecisionProbability is the probability of one option or one level, named
// by its value or label.
message DecisionProbability {
  string value = 1;
  double probability = 2;
}

message DecisionRefusal {
}
