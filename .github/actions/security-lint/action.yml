name: Weaviate Security Lint
description: >
  Scans a pull request diff for hidden Unicode / trojan-source
  characters (https://trojansource.codes/).

inputs:
  pr-number:
    description: Pull request number whose diff will be scanned.
    required: true
  head-sha:
    description: The commit at the head of the pull request, as the event names it.
    required: true

runs:
  using: composite
  steps:
    - name: Check PR diff for hidden Unicode
      shell: bash
      # Inputs are passed through env vars — never interpolated into the
      # run block directly — so attacker-controlled values can't escape
      # the shell context (GHA script injection / CWE-94).
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
      # The diff comes from git, not from the GitHub API: the API refuses the
      # diff of a PR of more than 300 files or 20 000 lines, which left such a
      # PR unscanned and the check red. The PR's commits are fetched as
      # objects and only diffed against the merge base, the same three-dot
      # diff the API gives; nothing of the PR is checked out or run. The
      # checkout of the base branch must carry its history (fetch-depth: 0).
      run: |
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "invalid PR number: $PR_NUMBER" >&2; exit 1; }
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid head sha: $HEAD_SHA" >&2; exit 1; }
        git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
        git cat-file -e "${HEAD_SHA}^{commit}"
        base=$(git merge-base HEAD "$HEAD_SHA")
        git diff "$base" "$HEAD_SHA" \
          | bash "$GITHUB_ACTION_PATH/linter_hidden_unicode.sh" --stdin
