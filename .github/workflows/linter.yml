name: golangci-lint
on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
jobs:
  golangci:
    name: golangci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Run golangci-lint
        uses: ./.github/actions/golangci-lint
  protolint:
    name: protolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The action has reviewdog fetch the PR diff from the GitHub API, which
      # refuses a PR of more than 300 files or 20 000 lines and fails the job
      # whatever the PR changes. git tells first whether the PR changes a
      # .proto file at all; a PR that does not has nothing to lint.
      - name: Changed .proto files
        id: protos
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$BASE_SHA" HEAD)
          if git diff --name-only "$base" HEAD -- '*.proto' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.protos.outputs.changed == 'true'
        uses: yoheimuta/action-protolint@e62319541dc5107df5e3a5010acb8987004d3d25 # v1
  python:
    name: python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: psf/black@258e7dbf348bc23cb70b8cdf693481c04634ebcc # stable
        with:
          version: "26.3.1"
  custom:
    name: custom checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Error groups checks
        run: ./tools/linter_error_groups.sh
      - name: goroutine checks
        run: ./tools/linter_go_routines.sh
      - name: waitgroups checks
        run: ./tools/linter_waitgroups_done.sh