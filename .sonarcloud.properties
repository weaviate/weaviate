# Generated code is committed verbatim (go-swagger, protobuf) and re-emitted
# on every spec change; its repetitive scaffolding is not actionable
# duplication. Exclude it from copy-paste detection.
sonar.cpd.exclusions=adapters/handlers/rest/embedded_spec.go,adapters/handlers/rest/operations/**,client/**,entities/models/**,grpc/generated/**
